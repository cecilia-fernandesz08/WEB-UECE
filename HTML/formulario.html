<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
            <legend>Informações Pessoal</legend>
            
            <label for="name">Nome</label>
            <input type="text" id="name" placeholder="Nome Completo" required > <br>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail"> <br>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha"> <br>
            <label for="arquivo">Upload</label>
            <input type="file" id="arquivo"><br>
            <label for="data">Nascimento</label>
            <input type="date" id="data"><br>
            <span>Sexo:</span>
            <input type="radio" name="sexo">
            <label for="">Masculino</label>
            <input type="radio" name="sexo">
            <label for="">Feminino</label><br>
            <input type="checkbox" id="sim" name="termos">
            <label for="">Li e concordo</label>
            
            <div>
                <label for="select_estado">estado:</label>
                <select name="estado" id="select_estado">
                    <option value="escolha"></option>
                    <option value="ce">Ceará</option>
                    <option value="sp">São Paulo</option>
                </select>
            </div>
        </fieldset>
        <div>
            <label for="">Frases</label>
            <textarea rows="5"cols="15" name="frase" id=""></textarea>
        </div>
        <input type="button" value="Enviar">
    
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
