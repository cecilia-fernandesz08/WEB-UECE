<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas em HTML</h1>

    <h2>lista não ordenada</h2>
    <p>para criar uma lista não ordenada, usa-se a tag &lt;ul&gt;</p>

    <ul>
        <li>item </li>
        <li>item </li>
        <li>item </li>
    </ul>

    <h2>lista ordernada</h2>
    <ol>
        <li>primeiro</li>
        <li>segundo</li>
        <li>terceiro</li>
    </ol>
    <p>para criar uma lista ordenada, usa-se a tag &lt;ol&gt;</p>
</body>
</html>
