<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Tabelas em HTML</h1>
    <p>para criar uma tabela, usa-se a tag &lt;table&gt;</p>
    <table border="1">
        <tr>
            <th>Disciplina</th>
            <th>Nota</th>
            <th>Situação</th>
        </tr>
        <tr>
            <td>matematica</td>
            <td>10</td>
            <td>aprovado</td>
        </tr>  
    </table>
    <h2>table semantico</h2>
    <p>thead, tbody e tfoot</p>

    <table border="1">
        <thead>
            <th>Produto</th>
            <th>Preço</th>
        </thead>
        <tbody>
            <tr>
                <td>Ovo</td>
                <td>R$ 1,00</td>
            </tr>
            <tr>
                <td>Uva</td>
                <td>R$5,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>R$ 6,00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
